<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;family=Sora:wght@700;800&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-lowest": "var(--shop-surface-lowest)",
            "secondary-fixed": "var(--shop-text)",
            "tertiary-container": "#c8c8c8",
            "on-tertiary": "#2f3131",
            "on-error": "#690005",
            "on-surface-variant": "var(--shop-text-muted)",
            "secondary-container": "#4a4949",
            "on-tertiary-container": "#525454",
            "on-primary-container": "#00612e",
            "on-secondary-fixed": "#1c1b1b",
            "surface-container-highest": "var(--shop-surface-highest)",
            "on-primary-fixed": "var(--shop-on-primary-fixed)",
            "on-background": "var(--shop-text)",
            "on-tertiary-fixed": "#1a1c1c",
            "inverse-primary": "#006d35",
            "primary": "var(--shop-primary)",
            "on-secondary-fixed-variant": "#474646",
            "on-primary": "var(--shop-on-primary)",
            "background": "var(--shop-background)",
            "inverse-on-surface": "var(--shop-background)",
            "on-tertiary-fixed-variant": "#454747",
            "inverse-surface": "var(--shop-text)",
            "outline-variant": "#3b4a3d",
            "primary-container": "var(--shop-primary-strong)",
            "tertiary-fixed": "#e2e2e2",
            "surface-container-low": "var(--shop-surface-low)",
            "surface": "var(--shop-background)",
            "tertiary": "#e4e4e4",
            "on-secondary-container": "#bab8b7",
            "surface-tint": "var(--shop-primary-strong)",
            "primary-fixed-dim": "var(--shop-primary-strong)",
            "surface-container": "var(--shop-surface)",
            "primary-fixed": "#62ff96",
            "tertiary-fixed-dim": "#c6c6c7",
            "on-secondary": "#313030",
            "surface-variant": "var(--shop-surface-highest)",
            "error-container": "#93000a",
            "error": "var(--shop-error)",
            "surface-dim": "var(--shop-background)",
            "secondary-fixed-dim": "#c8c6c5",
            "outline": "var(--shop-outline)",
            "on-surface": "var(--shop-text)",
            "surface-container-high": "var(--shop-surface-high)",
            "on-error-container": "#ffdad6",
            "on-primary-fixed-variant": "#005226",
            "secondary": "#c8c6c5",
            "surface-bright": "var(--shop-surface-bright)"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "base": "8px",
            "margin-mobile": "16px",
            "margin-desktop": "48px",
            "gutter": "24px",
            "container-max": "1280px"
          },
          "fontFamily": {
            "title-md": ["Hanken Grotesk"],
            "body-md": ["Hanken Grotesk"],
            "display-lg": ["Sora"],
            "headline-lg-mobile": ["Sora"],
            "label-sm": ["JetBrains Mono"],
            "headline-lg": ["Sora"]
          },
          "fontSize": {
            "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
            "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }]
          },
          "animation": {
            "marquee": "marquee 20s linear infinite",
          },
          "keyframes": {
            "marquee": {
              "0%": { transform: "translateX(100%)" },
              "100%": { transform: "translateX(-100%)" }
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --shop-background: #131313;
      --shop-background-rgb: 19, 19, 19;
      --shop-surface-lowest: #0e0e0e;
      --shop-surface-low: #1b1b1c;
      --shop-surface: #202020;
      --shop-surface-high: #2a2a2a;
      --shop-surface-highest: #353535;
      --shop-surface-bright: #393939;
      --shop-glass: rgba(32, 32, 32, 0.6);
      --shop-glass-card: rgba(32, 32, 32, 0.4);
      --shop-input: rgba(19, 19, 19, 0.8);
      --shop-border: rgba(255, 255, 255, 0.1);
      --shop-text: #e5e2e1;
      --shop-text-muted: #bacbb9;
      --shop-primary: #75ff9e;
      --shop-primary-strong: #00e676;
      --shop-on-primary: #003918;
      --shop-on-primary-fixed: #00210b;
      --shop-error: #ffb4ab;
      --shop-outline: #859585;
    }
    body { -webkit-font-smoothing: antialiased; }
    .glass-card {
      background: var(--shop-glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--shop-border);
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
